<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>CppScript</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f8fb;
  --panel: #ffffff;
  --text: #1a2332;
  --muted: #5a6a82;
  --accent: #2563eb;
  --code-bg: #eef2f7;
  --border: #d0d7e2;
  --ok: #15803d;
  --err: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --text: #e7ecf3;
    --muted: #8b9bb4;
    --accent: #3d8bfd;
    --code-bg: #0b1220;
    --border: #2a3548;
    --ok: #3dd68c;
    --err: #f87171;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 1rem;
  margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);
}
header h1 { font-size: 1.2rem; margin: 0; font-weight: 650; }
.meta { color: var(--muted); font-size: 0.85rem; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.85rem 1rem;
  margin-bottom: 0.85rem;
}
.card h2 {
  font-size: 0.8rem; margin: 0 0 0.5rem; color: var(--muted);
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
}
label { display: block; font-size: 0.8rem; color: var(--muted); margin: 0.5rem 0 0.25rem; font-weight: 600; }
textarea, input[type=text], input[type=url] {
  width: 100%;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88rem;
  background: var(--code-bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.65rem 0.8rem;
}
textarea.code { min-height: 180px; resize: vertical; line-height: 1.45; }
textarea.out {
  min-height: 160px; resize: vertical; white-space: pre-wrap;
}
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.6rem; }
button {
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.5rem 1rem;
  font-size: 0.9rem;
  font-weight: 600;
}
button:disabled { opacity: 0.55; cursor: not-allowed; }
button.secondary {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--border);
}
.badge {
  display: inline-block; font-size: 0.75rem; padding: 0.15rem 0.5rem;
  border-radius: 999px; border: 1px solid var(--border); color: var(--muted);
}
.badge.ok { color: var(--ok); border-color: var(--ok); }
.badge.err { color: var(--err); border-color: var(--err); }
.badge.wait { color: var(--accent); border-color: var(--accent); }
.hint { color: var(--muted); font-size: 0.78rem; margin-top: 0.35rem; }
.foot { margin-top: 1rem; color: var(--muted); font-size: 0.8rem; }
a { color: var(--accent); }
.tabs { display: flex; gap: 0.35rem; margin-bottom: 0.5rem; }
.tabs button {
  background: transparent; color: var(--muted); border: 1px solid var(--border);
  font-weight: 500; padding: 0.35rem 0.75rem;
}
.tabs button.active { color: var(--accent); border-color: var(--accent); }
#lineIn:disabled { opacity: 0.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CppScript</h1>
    <span class="badge" id="status">就绪</span>
    <span class="meta">纯前端 · 加载本地 JS 模块 · 不请求 Worker</span>
  </header>

  <div class="card">
    <h2>规则</h2>
    <div class="tabs">
      <button type="button" class="active" id="tabCode" data-tab="code">源代码</button>
      <button type="button" id="tabUrl" data-tab="url">规则 URL</button>
    </div>
    <div id="paneCode">
      <textarea class="code" id="code" spellcheck="false" placeholder="auto main() { ... }"></textarea>
    </div>
    <div id="paneUrl" hidden>
      <input type="url" id="ruleUrl" placeholder="https://.../rule.txt（需 CORS 允许）" />
      <p class="hint">从远程加载源码到编辑器（不自动运行）</p>
      <div class="row">
        <button type="button" class="secondary" id="btnLoad">加载到编辑器</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>参数 key（可选）</h2>
    <input type="text" id="key" placeholder='例如 2^3 或 {1,"abc",false}' />
  </div>

  <div class="row" style="margin-bottom:0.85rem">
    <button type="button" id="btnRun">运行</button>
    <button type="button" class="secondary" id="btnClearOut">清空输出</button>
  </div>

  <div class="card">
    <h2>输出</h2>
    <textarea class="out" id="out" readonly placeholder="out() 会实时出现在这里"></textarea>
  </div>

  <div class="card">
    <h2>标准输入</h2>
    <p class="hint">程序执行到 <code>in()</code> / <code>getchar</code> 且需要数据时，在此输入。<strong>每按一次 Enter 提交当前行</strong>；点「完成」表示输入结束（EOF）。</p>
    <div class="row" style="margin-top:0.5rem">
      <input type="text" id="lineIn" placeholder="输入一行后按 Enter 提交" style="flex:1;min-width:160px" disabled />
      <button type="button" id="btnDone" disabled>完成</button>
    </div>
    <p class="hint" id="inHint">请先点击「运行」</p>
  </div>

  <p class="foot">
    <a href="./docs/">文档</a> ·
    本页通过 ES module 加载 <code>./src/*.js</code>，执行在浏览器内完成，不请求 Worker
  </p>
</div>

<script type="module">
import { parse } from './src/parser.js';
import { Interpreter } from './src/interpreter.js';
import { InteractiveInputStream } from './src/input.js';

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const outEl = $('out');
const codeEl = $('code');
const lineIn = $('lineIn');
const btnDone = $('btnDone');
const inHint = $('inHint');

const DEMO = `auto main() {
    out("name?\\n");
    string name;
    in(name);
    out("hello, ");
    out(name);
    out("\\n");
    return;
}
`;

if (!codeEl.value) codeEl.value = DEMO;

const pageUrl = new URL(location.href);
if (pageUrl.searchParams.has('key')) $('key').value = pageUrl.searchParams.get('key') || '';
const preload = pageUrl.searchParams.get('url');
if (preload) {
  $('ruleUrl').value = preload;
  showTab('url');
  loadRule(preload).then(() => showTab('code')).catch((e) => setStatus('加载失败: ' + e.message, true));
}

let stream = null;
let running = false;

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = 'badge' + (kind === true || kind === 'err' ? ' err' : kind === 'wait' ? ' wait' : kind === false || kind === 'ok' ? ' ok' : '');
}

function showTab(name) {
  const isCode = name === 'code';
  $('tabCode').classList.toggle('active', isCode);
  $('tabUrl').classList.toggle('active', !isCode);
  $('paneCode').hidden = !isCode;
  $('paneUrl').hidden = isCode;
}

$('tabCode').onclick = () => showTab('code');
$('tabUrl').onclick = () => showTab('url');

async function loadRule(url) {
  setStatus('加载中…');
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  codeEl.value = await res.text();
  setStatus('已加载', 'ok');
}

$('btnLoad').onclick = () => {
  const u = $('ruleUrl').value.trim();
  if (!u) return alert('请填写规则 URL');
  loadRule(u).then(() => showTab('code')).catch((e) => setStatus('加载失败: ' + e.message, true));
};

$('btnClearOut').onclick = () => { outEl.value = ''; };

function setInputEnabled(on, waiting) {
  lineIn.disabled = !on;
  btnDone.disabled = !on;
  if (!on) inHint.textContent = '请先点击「运行」';
  else if (waiting) inHint.textContent = '等待输入：输入一行后按 Enter；全部输完后点「完成」';
  else inHint.textContent = '可提前输入行（按 Enter 提交）；程序读到时会用到';
  if (on) lineIn.focus();
}

function submitLine() {
  if (!stream || lineIn.disabled) return;
  const line = lineIn.value;
  stream.pushLine(line);
  lineIn.value = '';
  // 不强制滚动输出；out 回调会写
}

lineIn.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    submitLine();
  }
});

btnDone.addEventListener('click', () => {
  if (!stream) return;
  stream.finish();
  setInputEnabled(false);
  inHint.textContent = '已发送「完成」（EOF）';
  setStatus('输入已结束', 'ok');
});

$('btnRun').onclick = async () => {
  if (running) return;
  const src = codeEl.value;
  if (!src.trim()) return alert('请输入源代码，或从「规则 URL」加载');

  outEl.value = '';
  running = true;
  $('btnRun').disabled = true;
  setStatus('运行中…', 'wait');

  stream = new InteractiveInputStream();
  setInputEnabled(true, true);

  // 包装：读操作时提示等待
  const origGetchar = stream.getchar.bind(stream);
  const origToken = stream.readToken.bind(stream);
  stream.getchar = async () => {
    setStatus('等待输入…', 'wait');
    inHint.textContent = '程序在等输入：写一行后按 Enter';
    const c = await origGetchar();
    if (c !== -1) setStatus('运行中…', 'wait');
    return c;
  };
  stream.readToken = async () => {
    setStatus('等待输入…', 'wait');
    inHint.textContent = '程序在等输入：写一行后按 Enter';
    const t = await origToken();
    if (t !== null) setStatus('运行中…', 'wait');
    return t;
  };

  try {
    const ast = parse(src);
    const fake = new URL('https://local.cppscript/run');
    const keyVal = $('key').value;
    fake.searchParams.set('key', keyVal);
    try {
      const u = new URL(location.href);
      if (keyVal) u.searchParams.set('key', keyVal);
      else u.searchParams.delete('key');
      history.replaceState(null, '', u);
    } catch (_) {}

    const interp = new Interpreter(ast, {
      url: fake,
      env: {},
      inputStream: stream,
      onChunk: (delta) => {
        outEl.value += delta;
        outEl.scrollTop = outEl.scrollHeight;
      },
    });

    const result = await interp.run();
    if (!outEl.value && interp.output) outEl.value = interp.output;

    if (result && result.redirect && result.url) {
      outEl.value += (outEl.value && !outEl.value.endsWith('\n') ? '\n' : '') + '[redirect] ' + result.url;
      setStatus('完成 · 跳转', 'ok');
      setTimeout(() => { location.href = result.url; }, 500);
    } else {
      setStatus('完成 ' + ((result && result.status) || 200), 'ok');
    }
  } catch (e) {
    const msg = (e && e.message) ? e.message : String(e);
    outEl.value += (outEl.value ? '\n' : '') + '[error] ' + msg;
    setStatus('错误', 'err');
  } finally {
    running = false;
    $('btnRun').disabled = false;
    if (stream && !stream.eof) {
      // 程序已结束，关闭输入
      setInputEnabled(false);
      inHint.textContent = '程序已结束';
    }
    stream = null;
  }
};
</script>
</body>
</html>
