<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>CppScript</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f8fb; --panel: #ffffff; --text: #1a2332; --muted: #5a6a82;
  --accent: #2563eb; --code-bg: #eef2f7; --border: #d0d7e2;
  --ok: #15803d; --err: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1419; --panel: #1a2332; --text: #e7ecf3; --muted: #8b9bb4;
    --accent: #3d8bfd; --code-bg: #0b1220; --border: #2a3548;
    --ok: #3dd68c; --err: #f87171;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.55;
}
body.modal-open { overflow: hidden; touch-action: none; }
.wrap { max-width: 960px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
header {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 1rem;
  margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);
}
header h1 { font-size: 1.2rem; margin: 0; font-weight: 650; }
.meta { color: var(--muted); font-size: 0.85rem; }
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.85rem;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 0.5rem; margin-bottom: 0.5rem;
}
.card h2 {
  font-size: 0.8rem; margin: 0; color: var(--muted);
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
}
textarea, input[type=text], input[type=url] {
  width: 100%;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88rem;
  background: var(--code-bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 0.8rem;
}
textarea.code { min-height: 180px; resize: vertical; line-height: 1.45; }
textarea.out { min-height: 160px; resize: vertical; white-space: pre-wrap; }
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.6rem; }
button {
  cursor: pointer; background: var(--accent); color: #fff; border: none;
  border-radius: 8px; padding: 0.5rem 1rem; font-size: 0.9rem; font-weight: 600;
}
button:disabled { opacity: 0.55; cursor: not-allowed; }
button.secondary {
  background: transparent; color: var(--accent); border: 1px solid var(--border);
}
.badge {
  display: inline-block; font-size: 0.75rem; padding: 0.15rem 0.5rem;
  border-radius: 999px; border: 1px solid var(--border); color: var(--muted);
}
.badge.ok { color: var(--ok); border-color: var(--ok); }
.badge.err { color: var(--err); border-color: var(--err); }
.badge.wait { color: var(--accent); border-color: var(--accent); }
.hint { color: var(--muted); font-size: 0.78rem; margin-top: 0.35rem; }
.foot { margin-top: 1rem; color: var(--muted); font-size: 0.8rem; }
a { color: var(--accent); }
.tabs { display: flex; gap: 0.35rem; margin-bottom: 0.5rem; }
.tabs button {
  background: transparent; color: var(--muted); border: 1px solid var(--border);
  font-weight: 500; padding: 0.35rem 0.75rem;
}
.tabs button.active { color: var(--accent); border-color: var(--accent); }
[hidden] { display: none !important; }
#btnStopBar { margin-bottom: 0.85rem; }
#btnStop { width: 100%; background: #b91c1c; padding: 0.65rem 1rem; }
@media (prefers-color-scheme: dark) { #btnStop { background: #dc2626; } }
.out-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.5rem; }
.out-head h2 { margin: 0; }
.out-head button { padding: 0.25rem 0.6rem; font-size: 0.78rem; }
.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; padding: 1rem; overflow: hidden;
}
.modal {
  background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px;
  max-width: 480px; width: 100%; padding: 1rem 1.1rem;
  box-shadow: 0 12px 40px rgba(0,0,0,.25);
}
.modal h3 { margin: 0 0 0.5rem; font-size: 1rem; }
.modal .url {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: ui-monospace, monospace; font-size: 0.85rem;
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 0.6rem 0.75rem; margin: 0.5rem 0 0.85rem;
}
.modal .msg { margin: 0.5rem 0 0.85rem; white-space: pre-wrap; word-break: break-word; }
.modal .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: flex-end; }
.modal .actions button { font-size: 0.85rem; }
.modal .actions .secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
.toast {
  position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--ok); color: var(--ok);
  padding: 0.55rem 1rem; border-radius: 999px; font-size: 0.9rem; font-weight: 600;
  z-index: 10000; box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CppScript</h1>
    <span class="badge" id="status">就绪</span>
    <span class="meta">浏览器执行</span>
  </header>

  <!-- 1. 代码框（未运行显示，运行中隐藏） -->
  <div class="card" id="cardRule">
    <div class="card-head">
      <h2>代码</h2>
      <button type="button" id="btnRun">运行</button>
    </div>
    <div class="tabs">
      <button type="button" class="active" id="tabCode">编辑器</button>
      <button type="button" id="tabUrl">URL</button>
    </div>
    <div id="paneCode">
      <textarea class="code" id="code" spellcheck="false" placeholder="auto main() { ... }"></textarea>
    </div>
    <div id="paneUrl" hidden>
      <input type="url" id="ruleUrl" placeholder="https://.../rule.txt" />
      <p class="hint">无协议自动补 https；http 升为 https。点「运行」会先保存到地址栏再执行。</p>
      <div class="row">
        <button type="button" class="secondary" id="btnLoad">加载到编辑器</button>
      </div>
    </div>
  </div>

  <!-- 2. 输出 -->
  <div class="card" id="cardOut" hidden>
    <div class="out-head">
      <h2>输出</h2>
      <button type="button" class="secondary" id="btnClearOut">清空输出</button>
    </div>
    <textarea class="out" id="out" readonly></textarea>
  </div>

  <!-- 3. 强行停止（运行中显示） -->
  <div id="btnStopBar" hidden>
    <button type="button" id="btnStop">强行停止</button>
  </div>

  <!-- 4. 标准输入 -->
  <div class="card" id="cardIn" hidden>
    <h2>标准输入</h2>
    <p class="hint">Enter 提交一行；「完成」= EOF</p>
    <div class="row">
      <input type="text" id="lineIn" placeholder="输入一行后按 Enter" style="flex:1;min-width:160px" disabled />
      <button type="button" id="btnDone" disabled>完成</button>
    </div>
    <p class="hint" id="inHint"></p>
  </div>

  <!-- 5. key -->
  <div class="card" id="cardKey" hidden>
    <h2>参数 key</h2>
    <input type="text" id="key" placeholder='例如 2^3 或 {1,"abc",false}' />
  </div>

  <!-- 6. query -->
  <div class="card" id="cardQuery" hidden>
    <h2>Query 参数</h2>
    <textarea id="queryBox" rows="4" placeholder="一行一个：&#10;a=1&#10;b=hello"></textarea>
  </div>

  <p class="foot"><a href="./docs/">文档</a></p>
</div>

<div class="modal-mask" id="appModal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle">提示</h3>
    <div class="url" id="modalUrl" hidden></div>
    <div class="msg" id="modalMsg" hidden></div>
    <div class="actions" id="modalActions"></div>
  </div>
</div>

<script type="module">
import { parse } from './src/parser.js';
import { Interpreter } from './src/interpreter.js';
import { InteractiveInputStream, InputStream } from './src/input.js';
import { ensureHttps } from './src/request.js';

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const outEl = $('out');
const codeEl = $('code');
const lineIn = $('lineIn');
const btnDone = $('btnDone');
const inHint = $('inHint');
const cardRule = $('cardRule');
const cardKey = $('cardKey');
const cardQuery = $('cardQuery');
const cardIn = $('cardIn');
const cardOut = $('cardOut');
const queryBox = $('queryBox');
const btnRun = $('btnRun');
const btnStop = $('btnStop');
const btnStopBar = $('btnStopBar');
const ruleUrlEl = $('ruleUrl');

const DEMO = `auto main() {
    out("name?\\n");
    string name;
    in(name);
    out("hello, ");
    out(name);
    out("\\n");
    return;
}
`;

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = 'badge' + (
    kind === 'err' || kind === true ? ' err'
    : kind === 'wait' ? ' wait'
    : kind === 'ok' || kind === false ? ' ok' : ''
  );
}

function showToast(text) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

function lockScroll(on) {
  document.body.classList.toggle('modal-open', !!on);
}

function openModal({ title, url, message, buttons }) {
  return new Promise((resolve) => {
    const mask = $('appModal');
    $('modalTitle').textContent = title || '提示';
    const urlEl = $('modalUrl');
    const msgEl = $('modalMsg');
    const actions = $('modalActions');
    actions.innerHTML = '';
    if (url) {
      urlEl.hidden = false;
      urlEl.textContent = url;
      urlEl.title = url;
    } else urlEl.hidden = true;
    if (message) {
      msgEl.hidden = false;
      msgEl.textContent = message;
    } else msgEl.hidden = true;
    const close = (val) => {
      mask.hidden = true;
      lockScroll(false);
      resolve(val);
    };
    for (const b of buttons) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = b.label;
      if (b.secondary) btn.className = 'secondary';
      btn.onclick = async () => {
        if (b.onClick) await b.onClick();
        if (b.keepOpen) return;
        close(b.value);
      };
      actions.appendChild(btn);
    }
    mask.hidden = false;
    lockScroll(true);
  });
}

function showModalConfirm(message) {
  return openModal({
    title: '确认',
    message: String(message ?? ''),
    buttons: [
      { label: '取消', secondary: true, value: false },
      { label: '确定', value: true },
    ],
  });
}

function openRedirectModal(url) {
  return openModal({
    title: '确认跳转',
    url,
    buttons: [
      {
        label: '复制链接',
        secondary: true,
        keepOpen: true,
        onClick: async () => {
          try {
            await navigator.clipboard.writeText(url);
            showToast('已复制');
          } catch {
            const ta = document.createElement('textarea');
            ta.value = url;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); showToast('已复制'); } catch (_) {}
            ta.remove();
          }
        },
      },
      { label: '取消', secondary: true, value: false },
      { label: '确认跳转', value: true },
    ],
  }).then((go) => {
    if (go) location.href = url;
    return go;
  });
}

function analyzeNeeds(ast) {
  let needsKey = false, needsIn = false, needsOut = false, needsQuery = false;
  const IN_FNS = new Set(['getchar', 'scanf']);
  const OUT_FNS = new Set(['out', 'printf', 'puts', 'putchar']);
  const Q_BUILTINS = new Set(['keyword', 'repoPath', 'tag', 'selector', 'prerelease', 'p1', 'p2', 'p3', 'p4']);
  const walk = (n) => {
    if (!n || typeof n !== 'object') return;
    if (Array.isArray(n)) { n.forEach(walk); return; }
    if (n.type === 'Ident') {
      if (n.name === 'key') needsKey = true;
      if (Q_BUILTINS.has(n.name)) needsQuery = true;
    }
    if (n.type === 'In') needsIn = true;
    if (n.type === 'Call' && n.callee && n.callee.type === 'Ident') {
      const fn = n.callee.name;
      if (IN_FNS.has(fn)) needsIn = true;
      if (OUT_FNS.has(fn)) needsOut = true;
      if (fn === 'q_get') {
        const a0 = n.args && n.args[0];
        if (a0 && a0.type === 'String' && a0.value === 'key') needsKey = true;
        else needsQuery = true;
      }
    }
    for (const k of Object.keys(n)) {
      if (k === 'type') continue;
      walk(n[k]);
    }
  };
  walk(ast);
  return { needsKey, needsIn, needsOut, needsQuery };
}

function parseQueryBoxText(text) {
  const map = Object.create(null);
  for (const line of String(text || '').split(/\r?\n/)) {
    const s = line.trim();
    if (!s || s.startsWith('#')) continue;
    const eq = s.indexOf('=');
    if (eq <= 0) continue;
    const k = s.slice(0, eq).trim();
    const v = s.slice(eq + 1);
    if (k) map[k] = v;
  }
  return map;
}

function getLiveQueryParam(name) {
  if (name === 'key') return $('key').value || '';
  const box = parseQueryBoxText(queryBox.value);
  if (Object.prototype.hasOwnProperty.call(box, name)) return box[name];
  try {
    const u = new URL(location.href);
    if (u.searchParams.has(name)) return u.searchParams.get(name) || '';
  } catch (_) {}
  return '';
}

function setUrlParam(key, value, removeIfEmpty = true) {
  try {
    const u = new URL(location.href);
    if (value == null || value === '') {
      if (removeIfEmpty) u.searchParams.delete(key);
    } else {
      u.searchParams.set(key, value);
    }
    history.replaceState(null, '', u);
  } catch (_) {}
}

function hideRuntimePanels() {
  cardKey.hidden = true;
  cardQuery.hidden = true;
  cardIn.hidden = true;
}

/** 保存 URL 页内容到地址栏参数（不刷新） */
function saveUrlFromBox() {
  let u = ruleUrlEl.value.trim();
  if (!u) {
    setUrlParam('url', '');
    return '';
  }
  u = ensureHttps(u);
  ruleUrlEl.value = u;
  setUrlParam('url', u);
  return u;
}

function showTab(name, { fromUser = false } = {}) {
  const isCode = name === 'code';
  // 切到编辑器：若 URL 框或地址栏有 url，先保存
  if (isCode && fromUser) {
    const box = ruleUrlEl.value.trim();
    const param = new URL(location.href).searchParams.get('url');
    if (box || param) {
      const u = saveUrlFromBox() || (param ? ensureHttps(param) : '');
      if (u && !codeEl.value.trim()) {
        // 有 URL 但编辑器空：尝试加载
        loadRule(u).catch(() => {});
      }
    }
  }
  $('tabCode').classList.toggle('active', isCode);
  $('tabUrl').classList.toggle('active', !isCode);
  $('paneCode').hidden = !isCode;
  $('paneUrl').hidden = isCode;
}

$('tabCode').onclick = () => showTab('code', { fromUser: true });
$('tabUrl').onclick = () => showTab('url', { fromUser: true });

async function loadRule(url) {
  const fixed = ensureHttps(url);
  setStatus('加载规则…', 'wait');
  const res = await fetch(fixed);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  codeEl.value = await res.text();
  setStatus('已加载', 'ok');
  return fixed;
}

$('btnLoad').onclick = async () => {
  let u = ruleUrlEl.value.trim();
  if (!u) return alert('请填写规则 URL');
  u = ensureHttps(u);
  ruleUrlEl.value = u;
  try {
    await loadRule(u);
    setUrlParam('url', u);
    showTab('code');
    hideRuntimePanels();
    cardOut.hidden = true;
  } catch (e) {
    setStatus('加载失败: ' + e.message, 'err');
  }
};

$('btnClearOut').onclick = () => {
  outEl.value = '';
  cardOut.hidden = true;
};

let codeEditTimer = null;
codeEl.addEventListener('input', () => {
  clearTimeout(codeEditTimer);
  codeEditTimer = setTimeout(() => {
    setUrlParam('url', '');
    ruleUrlEl.value = '';
  }, 200);
});

let stream = null;
let running = false;

function setInputEnabled(on) {
  lineIn.disabled = !on;
  btnDone.disabled = !on;
  inHint.textContent = on ? 'Enter 提交一行；完成 = EOF' : '';
  if (on) lineIn.focus();
}

function submitLine() {
  if (!stream || lineIn.disabled) return;
  stream.pushLine(lineIn.value);
  lineIn.value = '';
}
lineIn.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); submitLine(); }
});
btnDone.addEventListener('click', () => {
  if (!stream) return;
  if (lineIn.value !== '') {
    stream.pushLine(lineIn.value);
    lineIn.value = '';
  }
  stream.finish();
  setInputEnabled(false);
  inHint.textContent = '输入已结束';
});

function fetchViaEnv() {
  try { return location.origin + '/api/fetch?target='; } catch { return ''; }
}

function setRunningUI(on) {
  if (on) {
    cardRule.hidden = true;
    btnStopBar.hidden = false;
    btnStop.disabled = false;
  } else {
    cardRule.hidden = false;
    btnStopBar.hidden = true;
    btnStop.disabled = true;
    btnRun.disabled = false;
    btnRun.textContent = '运行';
  }
}

async function runCode(src, options = {}) {
  if (running) return;
  if (!src || !src.trim()) {
    alert('请输入源代码或加载规则');
    return;
  }

  outEl.value = '';
  running = true;
  setRunningUI(true);
  setStatus('运行中…', 'wait');
  hideRuntimePanels();
  cardOut.hidden = true;

  const abortCtl = new AbortController();
  window.__cppsAbort = abortCtl;

  let needs = { needsKey: false, needsIn: false, needsOut: false, needsQuery: false };
  let ast;
  try {
    ast = parse(src);
    needs = analyzeNeeds(ast);
  } catch (e) {
    cardOut.hidden = false;
    outEl.value = '[error] ' + (e.message || e);
    setStatus('解析错误', 'err');
    running = false;
    window.__cppsAbort = null;
    setRunningUI(false);
    return;
  }

  cardKey.hidden = !needs.needsKey;
  cardQuery.hidden = !needs.needsQuery;
  cardIn.hidden = !needs.needsIn;
  // 仅当代码会真正写输出流时才预先显示输出框
  if (needs.needsOut) cardOut.hidden = false;

  if (needs.needsIn) {
    stream = new InteractiveInputStream(options.prefillIn || '');
    setInputEnabled(true);
    abortCtl.signal.addEventListener('abort', () => {
      try { stream.finish(); } catch (_) {}
    });
  } else {
    stream = new InputStream(options.prefillIn || '');
    setInputEnabled(false);
  }

  const keyVal = needs.needsKey ? ($('key').value || '') : '';
  const fake = new URL('https://local.cppscript/run');
  if (needs.needsKey) fake.searchParams.set('key', keyVal);

  let hadStreamOut = false;
  try {
    const interp = new Interpreter(ast, {
      url: fake,
      env: { FETCH_VIA: fetchViaEnv() },
      inputStream: stream,
      getQueryParam: getLiveQueryParam,
      abortSignal: abortCtl.signal,
      showModal: showModalConfirm,
      onChunk: (delta) => {
        hadStreamOut = true;
        if (cardOut.hidden) cardOut.hidden = false;
        outEl.value += delta;
        outEl.scrollTop = outEl.scrollHeight;
      },
    });

    const result = await interp.run();
    if (interp.output && interp.output.length) {
      hadStreamOut = true;
      if (cardOut.hidden) cardOut.hidden = false;
      if (!outEl.value) outEl.value = interp.output;
    }

    // 跳转不算输出：仅有 redirect 时不显示输出框（除非已有 out 内容）
    if (result && result.redirect && result.url) {
      const mode = result.redirectMode || 'auto';
      if (hadStreamOut) {
        outEl.value += (outEl.value && !outEl.value.endsWith('\n') ? '\n' : '') +
          '[redirect' + (mode === 'confirm' ? '·确认' : '') + '] ' + result.url;
      } else {
        cardOut.hidden = true;
      }
      setStatus('完成 · 跳转', 'ok');
      showToast('运行完成');
      if (mode === 'confirm') {
        await openRedirectModal(result.url);
      } else {
        setTimeout(() => { location.href = result.url; }, 1500);
      }
    } else {
      setStatus('完成 ' + ((result && result.status) || 200), 'ok');
      showToast('运行完成');
    }
  } catch (e) {
    const msg = (e && e.message) ? e.message : String(e);
    if (cardOut.hidden) cardOut.hidden = false;
    outEl.value += (outEl.value ? '\n' : '') + '[error] ' + msg;
    setStatus(msg.includes('abort') ? '已停止' : '错误', 'err');
    if (msg.includes('abort')) showToast('已强制停止');
  } finally {
    running = false;
    window.__cppsAbort = null;
    setRunningUI(false);
    setInputEnabled(false);
    stream = null;
    hideRuntimePanels();
    inHint.textContent = '';
  }
}

/** 运行入口：若在 URL 页则先保存参数并加载源码 */
async function onRunClick() {
  if (running) return;
  // 当前在 URL 页：先保存 URL 到地址栏，再加载再运行
  const onUrlTab = !$('paneUrl').hidden;
  if (onUrlTab) {
    const u = saveUrlFromBox();
    if (!u) {
      alert('请填写规则 URL');
      return;
    }
    try {
      await loadRule(u);
    } catch (e) {
      setStatus('加载失败: ' + e.message, 'err');
      return;
    }
  }
  await runCode(codeEl.value);
}

btnStop.onclick = () => {
  if (window.__cppsAbort) {
    window.__cppsAbort.abort();
    setStatus('正在停止…', 'wait');
  }
};

btnRun.onclick = () => onRunClick();

// ---------- boot ----------
const pageUrl = new URL(location.href);
if (pageUrl.searchParams.has('key')) $('key').value = pageUrl.searchParams.get('key') || '';
{
  const skip = new Set(['url', 'key', 'in', 'run', 'server']);
  const lines = [];
  for (const [k, v] of pageUrl.searchParams.entries()) {
    if (skip.has(k)) continue;
    lines.push(k + '=' + v);
  }
  if (lines.length) queryBox.value = lines.join('\n');
}

const preload = pageUrl.searchParams.get('url');
if (preload) {
  const fixed = ensureHttps(preload);
  ruleUrlEl.value = fixed;
  if (fixed !== preload) setUrlParam('url', fixed);
  // 有 url 参数：默认停在 URL 页，不自动切编辑器
  showTab('url');
  (async () => {
    try {
      await loadRule(fixed);
      // 仍停在 URL 页；用户点编辑器才会切换并保存
      await runCode(codeEl.value, { prefillIn: pageUrl.searchParams.get('in') || '' });
    } catch (e) {
      setStatus('加载失败: ' + e.message, 'err');
    }
  })();
} else {
  showTab('code');
  if (!codeEl.value) codeEl.value = DEMO;
}
</script>
</body>
</html>
