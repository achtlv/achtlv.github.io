<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗地主 · 真人联机版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&amp;display=swap');
        body { font-family: 'Noto Sans SC', system-ui, sans-serif; }
        .game-bg { background: linear-gradient(135deg, #166534 0%, #14532d 100%); }
        .card {
            width: 52px; height: 72px; background: white; border: 2px solid #334155;
            border-radius: 8px; box-shadow: 3px 4px 8px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 700; transition: all 0.2s cubic-bezier(0.4,0,0.2,1); position: relative;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 4px 6px 12px rgba(0,0,0,0.4); }
        .card.selected { border-color: #eab308; box-shadow: 0 0 0 4px rgba(234,179,8,0.5); transform: translateY(-6px) scale(1.05); }
        .card-back {
            background: linear-gradient(145deg, #1e40af, #3b82f6);
            border: 2px solid #1e3a8a; box-shadow: 2px 3px 6px rgba(0,0,0,0.3);
        }
        .poker-table { background: radial-gradient(circle at center, #166534 0%, #14532d 70%); }
        .player-area { transition: all 0.3s ease; }
        .player-active { box-shadow: 0 0 0 4px rgba(234,179,8,0.6); border-radius: 12px; }
        .joker-card { background: linear-gradient(145deg, #f8fafc, #e0e7ff); border-color: #64748b; }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <div class="max-w-7xl mx-auto px-4">
        <!-- Header -->
        <div class="flex items-center justify-between py-6">
            <div class="flex items-center gap-x-3">
                <div class="w-11 h-11 bg-yellow-500 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-chess-king text-zinc-900 text-3xl"></i>
                </div>
                <div>
                    <h1 class="text-4xl font-bold tracking-tight">斗地主</h1>
                    <p class="text-emerald-400 text-sm -mt-1">真人三人联机版 · Cloudflare Workers</p>
                </div>
            </div>
            <div id="room-info" class="hidden items-center gap-x-3 bg-zinc-900 px-4 py-2 rounded-2xl border border-zinc-800">
                <div class="text-xs text-zinc-400">房间号</div>
                <div id="room-code" class="font-mono text-2xl font-bold text-yellow-400 tracking-[3px]"></div>
                <button onclick="copyRoomCode()" class="text-emerald-400 hover:text-emerald-300 px-2">
                    <i class="fa-solid fa-copy"></i>
                </button>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen">
            <div class="max-w-md mx-auto bg-zinc-900 border border-zinc-800 rounded-3xl p-8">
                <h2 class="text-2xl font-bold mb-6 text-center">加入或创建房间</h2>
                
                <div class="space-y-4">
                    <!-- Nickname -->
                    <div>
                        <label class="block text-sm text-zinc-400 mb-1.5">你的昵称</label>
                        <input id="nickname" type="text" value="玩家1" 
                               class="w-full bg-zinc-950 border border-zinc-700 focus:border-emerald-500 rounded-2xl px-4 py-3 text-lg outline-none">
                    </div>

                    <!-- Create Room -->
                    <button onclick="createRoom()" 
                            class="w-full bg-emerald-600 hover:bg-emerald-500 transition py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>创建新房间</span>
                    </button>

                    <div class="flex items-center gap-x-3">
                        <div class="flex-1 h-px bg-zinc-700"></div>
                        <span class="text-xs text-zinc-500">或</span>
                        <div class="flex-1 h-px bg-zinc-700"></div>
                    </div>

                    <!-- Join Room -->
                    <div class="flex gap-x-3">
                        <input id="join-code" type="text" placeholder="输入房间号" 
                               class="flex-1 bg-zinc-950 border border-zinc-700 focus:border-emerald-500 rounded-2xl px-4 py-3 text-lg font-mono uppercase outline-none">
                        <button onclick="joinRoom()" 
                                class="bg-zinc-700 hover:bg-zinc-600 transition px-8 rounded-2xl font-bold">
                            加入
                        </button>
                    </div>
                </div>
                
                <p class="text-center text-xs text-zinc-500 mt-8">最多3人 · 房间1小时后自动销毁</p>
            </div>
        </div>

        <!-- Waiting / Game Screen -->
        <div id="game-screen" class="hidden">
            <!-- Top Bar -->
            <div class="flex items-center justify-between mb-4 px-1">
                <div class="flex items-center gap-x-3">
                    <div id="player-count" class="px-4 py-1.5 bg-zinc-900 rounded-2xl text-sm border border-zinc-800 flex items-center gap-x-2">
                        <i class="fa-solid fa-users text-emerald-400"></i>
                        <span id="joined-count">1/3</span> 人
                    </div>
                    <div id="game-status-bar" class="px-4 py-1.5 bg-zinc-900 rounded-2xl text-sm border border-zinc-800">
                        <span id="status-text">等待其他玩家加入...</span>
                    </div>
                </div>
                
                <div class="flex items-center gap-x-2">
                    <button onclick="refreshState()" 
                            class="px-4 py-2 text-sm bg-zinc-800 hover:bg-zinc-700 rounded-2xl flex items-center gap-x-2">
                        <i class="fa-solid fa-sync"></i>
                        <span>刷新</span>
                    </button>
                    <button onclick="leaveRoom()" 
                            class="px-4 py-2 text-sm bg-red-900/70 hover:bg-red-900 rounded-2xl flex items-center gap-x-2">
                        <i class="fa-solid fa-sign-out-alt"></i>
                        <span>退出房间</span>
                    </button>
                </div>
            </div>

            <!-- Players + Table -->
            <div class="grid grid-cols-12 gap-4">
                <!-- Left Player -->
                <div class="col-span-3">
                    <div id="player-left" class="player-area bg-zinc-900 border border-zinc-800 rounded-3xl p-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-x-2">
                                <div class="w-9 h-9 bg-blue-600 rounded-2xl flex items-center justify-center">
                                    <i class="fa-solid fa-user text-white"></i>
                                </div>
                                <div>
                                    <div id="left-name" class="font-bold text-lg">等待中...</div>
                                    <div id="left-role" class="text-xs text-emerald-400">农民</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs text-zinc-400">手牌</div>
                                <div id="left-count" class="font-mono text-3xl font-bold">0</div>
                            </div>
                        </div>
                        <div id="left-cards" class="min-h-[92px] flex items-center justify-center bg-zinc-950 rounded-2xl border border-zinc-800 p-3">
                            <!-- face down cards or count -->
                        </div>
                    </div>
                </div>

                <!-- Center Table -->
                <div class="col-span-6">
                    <div class="poker-table rounded-3xl border border-emerald-900/50 p-5 h-full flex flex-col">
                        <div class="flex justify-center mb-3">
                            <div class="px-4 py-1 bg-emerald-950/70 rounded-2xl text-xs tracking-[2px] font-medium flex items-center gap-x-2">
                                <i class="fa-solid fa-table"></i>
                                <span>桌面</span>
                            </div>
                        </div>

                        <!-- Last Played -->
                        <div id="table-area" class="flex-1 min-h-[130px] flex items-center justify-center bg-emerald-950/30 rounded-2xl border border-emerald-900/40 p-4">
                            <!-- JS populated -->
                        </div>

                        <!-- Controls -->
                        <div id="controls" class="hidden mt-4">
                            <div class="flex justify-center gap-3">
                                <button onclick="passTurn()" 
                                        class="flex-1 max-w-[140px] px-8 py-3.5 bg-zinc-700 hover:bg-zinc-600 active:bg-zinc-800 transition font-semibold rounded-2xl text-sm">
                                    <i class="fa-solid fa-ban mr-2"></i>不要
                                </button>
                                <button onclick="playSelected()" 
                                        class="flex-1 max-w-[140px] px-8 py-3.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 transition font-bold rounded-2xl text-sm flex items-center justify-center gap-x-2">
                                    <i class="fa-solid fa-play mr-1"></i>
                                    <span>出牌</span>
                                </button>
                            </div>
                            <div id="message" class="mt-3 text-center text-sm text-emerald-300 min-h-[22px]"></div>
                        </div>
                    </div>
                </div>

                <!-- Right Player -->
                <div class="col-span-3">
                    <div id="player-right" class="player-area bg-zinc-900 border border-zinc-800 rounded-3xl p-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-x-2">
                                <div class="w-9 h-9 bg-violet-600 rounded-2xl flex items-center justify-center">
                                    <i class="fa-solid fa-user text-white"></i>
                                </div>
                                <div>
                                    <div id="right-name" class="font-bold text-lg">等待中...</div>
                                    <div id="right-role" class="text-xs text-emerald-400">农民</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs text-zinc-400">手牌</div>
                                <div id="right-count" class="font-mono text-3xl font-bold">0</div>
                            </div>
                        </div>
                        <div id="right-cards" class="min-h-[92px] flex items-center justify-center bg-zinc-950 rounded-2xl border border-zinc-800 p-3">
                        </div>
                    </div>
                </div>

                <!-- You (Bottom) -->
                <div class="col-span-12 mt-2">
                    <div id="player-bottom" class="player-area bg-zinc-900 border border-emerald-700 rounded-3xl p-5">
                        <div class="flex items-center justify-between mb-3 px-1">
                            <div class="flex items-center gap-x-3">
                                <div class="w-10 h-10 bg-emerald-600 rounded-2xl flex items-center justify-center">
                                    <i class="fa-solid fa-user text-white text-xl"></i>
                                </div>
                                <div>
                                    <div class="font-bold text-2xl flex items-center gap-x-2">
                                        <span id="bottom-name">你</span>
                                        <span id="bottom-role" class="text-xs px-2.5 py-0.5 bg-emerald-950 text-emerald-400 rounded-xl font-mono">农民</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-x-4">
                                <div class="text-right">
                                    <div class="text-xs text-emerald-400">手牌</div>
                                    <div id="bottom-count" class="font-mono text-4xl font-bold">0</div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Your Hand -->
                        <div id="human-cards" class="flex flex-wrap gap-1.5 justify-center min-h-[90px] bg-zinc-950 rounded-2xl border border-emerald-900/60 p-4">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================== CONFIG ==================
        // ⚠️ 请把下面改成你部署的 Cloudflare Worker 地址
        const WORKER_URL = 'https://ddz.achtlv.workers.dev';
        
        let currentRoomId = null;
        let currentPlayerId = null;
        let currentState = null;
        let selectedCards = [];
        let pollInterval = null;

        // Tailwind
        function initTailwind() {
            // already loaded via CDN
        }

        // ================== API Helpers ==================
        async function api(path, method = 'GET', body = null) {
            const opts = {
                method,
                headers: { 'Content-Type': 'application/json' }
            };
            if (body) opts.body = JSON.stringify(body);
            
            const res = await fetch(WORKER_URL + path, opts);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || '请求失败');
            return data;
        }

        // ================== Room Functions ==================
        async function createRoom() {
            const nickname = document.getElementById('nickname').value.trim() || '玩家';
            try {
                const res = await api('/create', 'POST', { nickname });
                currentRoomId = res.roomId;
                currentPlayerId = res.playerId;
                currentState = res.state;
                
                localStorage.setItem('doudizhu_room', currentRoomId);
                localStorage.setItem('doudizhu_player', currentPlayerId);
                
                showGameScreen();
                updateLobbyUI();
                startPolling();
            } catch (e) {
                alert('创建房间失败: ' + e.message);
            }
        }

        async function joinRoom() {
            const code = document.getElementById('join-code').value.trim().toUpperCase();
            const nickname = document.getElementById('nickname').value.trim() || '玩家';
            if (!code) return alert('请输入房间号');
            
            try {
                const res = await api('/join', 'POST', { roomId: code, nickname });
                currentRoomId = res.roomId;
                currentPlayerId = res.playerId;
                currentState = res.state;
                
                localStorage.setItem('doudizhu_room', currentRoomId);
                localStorage.setItem('doudizhu_player', currentPlayerId);
                
                showGameScreen();
                updateLobbyUI();
                startPolling();
            } catch (e) {
                alert('加入失败: ' + e.message);
            }
        }

        function copyRoomCode() {
            if (!currentRoomId) return;
            navigator.clipboard.writeText(currentRoomId).then(() => {
                const orig = event.currentTarget?.innerHTML;
                const btns = document.querySelectorAll('#room-info button');
                if (btns.length) {
                    btns[0].innerHTML = '<i class="fa-solid fa-check"></i>';
                    setTimeout(() => {
                        if (btns[0]) btns[0].innerHTML = '<i class="fa-solid fa-copy"></i>';
                    }, 1500);
                }
            });
        }

        function leaveRoom() {
            if (pollInterval) clearInterval(pollInterval);
            currentRoomId = null;
            currentPlayerId = null;
            currentState = null;
            selectedCards = [];
            localStorage.removeItem('doudizhu_room');
            localStorage.removeItem('doudizhu_player');
            
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('room-info').classList.add('hidden');
        }

        // ================== UI Update ==================
        function showGameScreen() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('room-info').classList.remove('hidden');
            document.getElementById('room-code').textContent = currentRoomId;
        }

        function updateLobbyUI() {
            if (!currentState) return;
            
            const count = Object.keys(currentState.players).length;
            document.getElementById('joined-count').textContent = `${count}/3`;
            
            const statusEl = document.getElementById('status-text');
            
            if (currentState.status === 'waiting') {
                statusEl.textContent = count < 3 ? '等待其他玩家加入...' : '游戏即将开始...';
            } else if (currentState.status === 'playing') {
                statusEl.textContent = '游戏进行中';
            } else if (currentState.status === 'ended') {
                statusEl.textContent = '游戏结束';
            }
            
            // Update player slots
            updatePlayerSlots();
        }

        function updatePlayerSlots() {
            if (!currentState || !currentState.players) return;
            
            const order = currentState.playerOrder || Object.keys(currentState.players);
            const you = currentState.players[currentPlayerId];
            
            // Find other two players
            const others = order.filter(pid => pid !== currentPlayerId);
            
            // Left
            if (others[0]) {
                const p = currentState.players[others[0]];
                document.getElementById('left-name').textContent = p.name;
                document.getElementById('left-role').textContent = p.role || '农民';
                document.getElementById('left-count').textContent = p.cardCount || 0;
                renderFaceDownCards('left-cards', p.cardCount || 0);
            } else {
                document.getElementById('left-name').textContent = '等待中...';
                document.getElementById('left-count').textContent = '0';
                document.getElementById('left-cards').innerHTML = '';
            }
            
            // Right
            if (others[1]) {
                const p = currentState.players[others[1]];
                document.getElementById('right-name').textContent = p.name;
                document.getElementById('right-role').textContent = p.role || '农民';
                document.getElementById('right-count').textContent = p.cardCount || 0;
                renderFaceDownCards('right-cards', p.cardCount || 0);
            } else {
                document.getElementById('right-name').textContent = '等待中...';
                document.getElementById('right-count').textContent = '0';
                document.getElementById('right-cards').innerHTML = '';
            }
            
            // You (bottom)
            if (you) {
                document.getElementById('bottom-name').textContent = you.name || '你';
                document.getElementById('bottom-role').textContent = you.role || '农民';
                document.getElementById('bottom-count').textContent = you.cardCount || you.hand?.length || 0;
                
                // Render your hand
                renderYourHand(you.hand || []);
            }
            
            // Highlight active player
            const isYourTurn = currentState.currentPlayer === currentPlayerId;
            document.getElementById('player-bottom').classList.toggle('player-active', isYourTurn);
            
            // Show/hide controls
            const controls = document.getElementById('controls');
            if (currentState.status === 'playing' && isYourTurn) {
                controls.classList.remove('hidden');
            } else {
                controls.classList.add('hidden');
            }
            
            // Render table (last play)
            renderTable();
            
            // Status message
            updateMessage();
        }

        function renderFaceDownCards(containerId, count) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (count === 0) return;
            
            const wrapper = document.createElement('div');
            wrapper.className = 'flex justify-center -space-x-3';
            
            const show = Math.min(count, 6);
            for (let i = 0; i < show; i++) {
                const back = document.createElement('div');
                back.className = 'card-back w-9 h-[52px] rounded-lg border border-blue-700 flex-shrink-0';
                wrapper.appendChild(back);
            }
            container.appendChild(wrapper);
        }

        function createCardElement(card, isClickable = false) {
            const el = document.createElement('div');
            el.className = `card w-[52px] h-[72px] flex-shrink-0`;
            
            if (card.rank === '小王' || card.rank === '大王') {
                el.classList.add('joker-card');
                el.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full w-full">
                        <div class="text-xs font-bold tracking-wider ${card.rank === '大王' ? 'text-red-600' : 'text-violet-600'}">${card.rank}</div>
                        <div class="text-3xl mt-0.5">${card.suit}</div>
                    </div>
                `;
            } else {
                el.style.color = (card.color === 'red') ? '#b91c1c' : '#1e2937';
                el.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full w-full px-1">
                        <div class="rank text-lg font-extrabold">${card.rank}</div>
                        <div class="suit -mt-1 text-xl">${card.suit}</div>
                    </div>
                `;
            }
            
            if (isClickable) el.style.cursor = 'pointer';
            return el;
        }

        function renderYourHand(hand) {
            const container = document.getElementById('human-cards');
            container.innerHTML = '';
            
            if (!hand || hand.length === 0) return;
            
            // Sort
            hand.sort((a, b) => a.value - b.value || a.suit.localeCompare(b.suit));
            
            hand.forEach(card => {
                const el = createCardElement(card, true);
                const isSelected = selectedCards.some(c => c.id === card.id);
                if (isSelected) {
                    el.classList.add('selected', 'ring-4', 'ring-yellow-400', 'scale-105', '-translate-y-1');
                }
                
                el.onclick = () => {
                    const idx = selectedCards.findIndex(c => c.id === card.id);
                    if (idx > -1) {
                        selectedCards.splice(idx, 1);
                        el.classList.remove('selected', 'ring-4', 'ring-yellow-400', 'scale-105', '-translate-y-1');
                    } else {
                        selectedCards.push(card);
                        el.classList.add('selected', 'ring-4', 'ring-yellow-400', 'scale-105', '-translate-y-1');
                    }
                };
                
                container.appendChild(el);
            });
        }

        function renderTable() {
            const container = document.getElementById('table-area');
            container.innerHTML = '';
            
            if (!currentState || !currentState.lastPlay || !currentState.lastPlay.cards) {
                const empty = document.createElement('div');
                empty.className = 'text-center text-emerald-300/60 py-4';
                empty.innerHTML = `<i class="fa-solid fa-hand-paper text-3xl mb-2 opacity-40"></i><div class="text-sm">等待出牌</div>`;
                container.appendChild(empty);
                return;
            }
            
            const lp = currentState.lastPlay;
            const label = document.createElement('div');
            label.className = 'text-center mb-2 text-xs';
            label.innerHTML = `<span class="px-3 py-0.5 bg-emerald-950 rounded-full text-emerald-400">${lp.playerName || '玩家'} 出牌</span>`;
            container.appendChild(label);
            
            const row = document.createElement('div');
            row.className = 'flex justify-center gap-1 flex-wrap';
            
            lp.cards.forEach(card => {
                const el = createCardElement(card, false);
                row.appendChild(el);
            });
            container.appendChild(row);
        }

        function updateMessage() {
            const msgEl = document.getElementById('message');
            if (!currentState || currentState.status !== 'playing') {
                msgEl.textContent = '';
                return;
            }
            
            const isYourTurn = currentState.currentPlayer === currentPlayerId;
            if (!isYourTurn) {
                const currentName = currentState.players[currentState.currentPlayer]?.name || '对方';
                msgEl.textContent = `等待 ${currentName} 出牌...`;
                return;
            }
            
            if (currentState.lastPlay) {
                msgEl.textContent = `请打过 ${currentState.lastPlay.playerName} 的牌`;
            } else {
                msgEl.textContent = '你的回合，请出牌';
            }
        }

        // ================== Game Actions ==================
        async function playSelected() {
            if (selectedCards.length === 0) {
                alert('请先选择要出的牌');
                return;
            }
            
            const cardIds = selectedCards.map(c => c.id);
            
            try {
                const res = await api('/play', 'POST', {
                    roomId: currentRoomId,
                    playerId: currentPlayerId,
                    cardIds
                });
                
                currentState = res.state;
                selectedCards = [];
                updatePlayerSlots();
                
            } catch (e) {
                alert(e.message);
            }
        }

        async function passTurn() {
            try {
                const res = await api('/pass', 'POST', {
                    roomId: currentRoomId,
                    playerId: currentPlayerId
                });
                currentState = res.state;
                selectedCards = [];
                updatePlayerSlots();
            } catch (e) {
                alert(e.message);
            }
        }

        async function refreshState() {
            if (!currentRoomId || !currentPlayerId) return;
            try {
                const state = await api(`/state?roomId=${currentRoomId}&playerId=${currentPlayerId}`, 'GET');
                currentState = state;
                updatePlayerSlots();
                
                // Auto show win modal if ended
                if (state.status === 'ended' && state.winner) {
                    showWinModal(state.winner === currentPlayerId, state.players[state.winner]?.name);
                }
            } catch (e) {
                console.error(e);
            }
        }

        function showWinModal(isWin, winnerName) {
            const modal = document.createElement('div');
            modal.className = `fixed inset-0 bg-black/80 flex items-center justify-center z-[100]`;
            modal.innerHTML = `
                <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8 max-w-md w-full mx-4 text-center">
                    <div class="text-7xl mb-4">${isWin ? '🏆' : '😔'}</div>
                    <h2 class="text-4xl font-bold mb-1">${isWin ? '恭喜你赢了！' : winnerName + ' 赢了'}</h2>
                    <p class="text-zinc-400 mb-8">斗地主真人联机对战结束</p>
                    <button onclick="this.closest('.fixed').remove(); leaveRoom()" 
                            class="bg-emerald-600 hover:bg-emerald-500 px-8 py-3.5 rounded-2xl font-bold text-lg w-full">
                        返回大厅
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // ================== Polling ==================
        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            
            pollInterval = setInterval(async () => {
                if (!currentRoomId || !currentPlayerId) return;
                
                try {
                    const state = await api(`/state?roomId=${currentRoomId}&playerId=${currentPlayerId}`, 'GET');
                    const oldStatus = currentState?.status;
                    currentState = state;
                    
                    updatePlayerSlots();
                    
                    // If game just started
                    if (oldStatus === 'waiting' && state.status === 'playing') {
                        document.getElementById('status-text').textContent = '游戏开始！';
                    }
                    
                    // Win check
                    if (state.status === 'ended' && state.winner) {
                        clearInterval(pollInterval);
                        setTimeout(() => {
                            showWinModal(state.winner === currentPlayerId, state.players[state.winner]?.name);
                        }, 800);
                    }
                } catch (e) {
                    console.error('Polling error:', e);
                }
            }, 1400); // poll every 1.4s
        }

        // ================== Init ==================
        function init() {
            initTailwind();
            
            // Try restore from localStorage
            const savedRoom = localStorage.getItem('doudizhu_room');
            const savedPlayer = localStorage.getItem('doudizhu_player');
            
            if (savedRoom && savedPlayer) {
                // Auto rejoin
                (async () => {
                    try {
                        const state = await api(`/state?roomId=${savedRoom}&playerId=${savedPlayer}`, 'GET');
                        currentRoomId = savedRoom;
                        currentPlayerId = savedPlayer;
                        currentState = state;
                        showGameScreen();
                        updatePlayerSlots();
                        startPolling();
                    } catch (e) {
                        // invalid, clear
                        localStorage.removeItem('doudizhu_room');
                        localStorage.removeItem('doudizhu_player');
                    }
                })();
            }
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (!currentState || currentState.status !== 'playing') return;
                if (currentState.currentPlayer !== currentPlayerId) return;
                
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (selectedCards.length > 0) playSelected();
                }
                if (e.key.toLowerCase() === 'p') {
                    e.preventDefault();
                    passTurn();
                }
            });
            
            console.log('%c[斗地主] 真人联机版已加载 - 请先部署 worker.js', 'color:#166534');
        }
        
        window.onload = init;
    </script>
</body>
</html>
