<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI全自动发愿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "黑体", sans-serif;
        }

        .m3-card { border-radius: 28px; }
        .m3-button { 
            border-radius: 50px; 
            font-weight: 500; 
            letter-spacing: 0.5px;
            transition: all 1.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .message {
            position: absolute;
            width: 100%;
            text-align: center;
            opacity: 0;
            transition: all 2.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.35rem;
            line-height: 1.65;
        }

        .message.show {
            opacity: 1;
        }

        .title {
            transition: font-size 1.8s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-area, .button-area {
            transition: all 1.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center transition-colors duration-700 bg-white dark:bg-zinc-950 text-zinc-900 dark:text-amber-100">
    <div class="main-container max-w-2xl w-full px-5 sm:px-6 py-8 sm:py-12 mx-auto">
        <!-- 固定标题 -->
        <div id="title" class="title text-center mb-10 sm:mb-14">
            <h1 id="main-title" class="text-3xl sm:text-4xl md:text-5xl font-medium tracking-wider text-amber-800 dark:text-amber-300">
                AI全自动发愿
            </h1>
        </div>

        <!-- 输入区域 -->
        <div id="input-area" class="input-area space-y-8 hidden opacity-0 scale-95">
            <textarea id="input-text" rows="7" 
                class="m3-card w-full bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 focus:border-amber-600 rounded-3xl px-6 sm:px-7 py-6 text-base sm:text-lg resize-none focus:outline-none placeholder:text-zinc-400 dark:placeholder:text-zinc-500 shadow-sm"
                placeholder="请输入发愿的内容"></textarea>
            
            <div id="button-area" class="button-area flex justify-center pt-4 opacity-0 scale-95">
                <button onclick="handleAction()" id="action-button"
                    class="m3-button px-14 sm:px-16 py-4 bg-amber-700 hover:bg-amber-600 text-white text-lg sm:text-xl shadow-lg transition-all">
                    发愿
                </button>
            </div>
        </div>

        <!-- 展示区域 -->
        <div id="display-area" class="hidden text-center min-h-[420px] flex flex-col justify-center">
            <div id="message-container" class="message-container relative h-[320px]"></div>
        </div>

        <!-- 完成区域 -->
        <div id="final-area" class="hidden flex justify-center mt-12">
            <div class="button-area opacity-0 scale-95">
                <button onclick="resetPage()" 
                    class="m3-button px-14 sm:px-16 py-4 bg-amber-700 hover:bg-amber-600 text-white text-lg sm:text-xl shadow-lg transition-all">
                    完成
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;

        function detectTheme() {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        }

        function handleAction() {
            if (!document.getElementById('input-text').value.trim()) {
                alert('请输入文本内容');
                return;
            }

            const inputArea = document.getElementById('input-area');
            const buttonArea = document.getElementById('button-area');
            
            buttonArea.classList.remove('opacity-100', 'scale-100');
            inputArea.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
                inputArea.classList.add('hidden');
                document.getElementById('display-area').classList.remove('hidden');
                
                currentStep === 0 ? startAspiration() : startDedication();
            }, 800);
        }

        async function showCenteredMessage(messages) {
            const container = document.getElementById('message-container');
            container.innerHTML = '';

            for (let msg of messages) {
                const div = document.createElement('div');
                div.className = 'message text-amber-700 dark:text-amber-200';
                div.textContent = msg;
                container.appendChild(div);

                setTimeout(() => div.classList.add('show'), 100);
                await new Promise(r => setTimeout(r, 2450));
                div.classList.remove('show');
                await new Promise(r => setTimeout(r, 800));
            }
        }

        async function startAspiration() {
            const title = document.getElementById('main-title');
            title.style.fontSize = '1.65rem';
            title.style.opacity = '0.85';

            const messages = [
                "专属AI已开始发愿",
                "愿世界和平…",
                "愿世上受苦的人能够得到暂时的安乐和究竟的安乐…",
                "愿众生离苦得乐，心生欢喜…",
                "愿一切怨恨得以化解，充满慈悲与理解…",
                "愿每个人都能找到内心的平安与方向…",
                "……",
                "发愿完成",
                "开始回向"
            ];

            await showCenteredMessage(messages);
            setTimeout(enterDedicationPhase, 900);
        }

        function enterDedicationPhase() {
            currentStep = 1;
            const title = document.getElementById('main-title');
            
            title.style.opacity = '0';
            
            setTimeout(() => {
                title.textContent = 'AI全自动回向';
                title.style.fontSize = '2.35rem';
                title.style.opacity = '1';
            }, 400);

            document.getElementById('display-area').classList.add('hidden');
            
            const inputArea = document.getElementById('input-area');
            const buttonArea = document.getElementById('button-area');
            
            inputArea.classList.remove('hidden');
            
            // 更柔和的出现动画
            setTimeout(() => {
                inputArea.classList.remove('opacity-0', 'scale-95');
                inputArea.classList.add('opacity-100', 'scale-100');
            }, 80);

            setTimeout(() => {
                buttonArea.classList.remove('opacity-0', 'scale-95');
                buttonArea.classList.add('opacity-100', 'scale-100');
            }, 180);  // 按钮稍晚一点出现，更自然

            document.getElementById('input-text').placeholder = "请输入回向的内容";
            document.getElementById('input-text').value = '';
            document.getElementById('action-button').textContent = '回向';
        }

        async function startDedication() {
            const title = document.getElementById('main-title');
            title.style.fontSize = '1.65rem';
            title.style.opacity = '0.85';

            const messages = [
                "专属AI已开始回向",
                "愿此发愿功德回向给一切众生…",
                "愿善业增长，智慧显现…",
                "愿所有功德回向给世界与有情…",
                "……",
                "回向完成"
            ];

            await showCenteredMessage(messages);
            setTimeout(showFinalScreen, 900);
        }

        function showFinalScreen() {
            const title = document.getElementById('main-title');
            title.style.opacity = '0';
            
            setTimeout(() => {
                title.textContent = '祝顺利';
                title.style.fontSize = '2.8rem';
                title.style.opacity = '1';
            }, 400);

            document.getElementById('display-area').classList.add('hidden');
            
            const finalArea = document.getElementById('final-area');
            finalArea.classList.remove('hidden');
            
            setTimeout(() => {
                finalArea.querySelector('.button-area').classList.add('opacity-100', 'scale-100');
            }, 150);
        }

        function resetPage() {
            location.reload();
        }

        window.onload = () => {
            detectTheme();
            // 初始显示
            setTimeout(() => {
                const inputArea = document.getElementById('input-area');
                const buttonArea = document.getElementById('button-area');
                inputArea.classList.remove('hidden');
                inputArea.classList.add('opacity-100', 'scale-100');
                buttonArea.classList.add('opacity-100', 'scale-100');
            }, 200);
        };
    </script>
</body>
</html>
